<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinkStrike embed test</title><style>body{background:#151c21;color:#eee;font:16px Arial;margin:24px}iframe{width:min(480px,95vw);height:480px;border:1px solid #e9fb70}button{padding:12px}p{max-width:650px}</style></head><body><h1>Embedded game test</h1><p>This tests a small sandboxed frame with mouse capture disabled. It does not reproduce every X policy or prove X will display a card. Keyboard and mouse required.</p><button id="create">Create test arena</button><div id="result"></div><script>document.getElementById('create').onclick=async()=>{const r=await fetch('/api/rooms',{method:'POST'});const data=await r.json();if(!r.ok)return;const f=document.createElement('iframe');f.title='LinkStrike playable frame';f.setAttribute('sandbox','allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox');f.src='/play/'+data.id;document.getElementById('result').replaceChildren(f);};</script></body></html>
